# Campus Pocket — XcodeGen project specification.
#
# The Xcode project is generated rather than committed. A .pbxproj is a machine-written file that
# conflicts on every branch and hides its own diffs; this file says the same thing in thirty
# readable lines and regenerates the project identically on any machine.
#
#   brew install xcodegen && cd apps/ios && xcodegen generate

name: CampusPocket

options:
  bundleIdPrefix: com.campus
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false

settings:
  base:
    SWIFT_VERSION: "5.10"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: complete

targets:
  CampusPocket:
    type: application
    platform: iOS
    sources:
      - path: CampusPocket
      # Shared with the extension: one definition of the folder both halves meet in.
      - path: CampusShared
    dependencies:
      - target: CampusShare
        embed: true
    info:
      path: CampusPocket/Info.plist
      properties:
        CFBundleDisplayName: Campus
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Documents are exposed to Finder and the Files app, which is the path the desktop's
        # USB sync reads the outbox through.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        NSCameraUsageDescription: >-
          Campus uses the camera to scan worksheets and pages into your workspace.
        NSPhotoLibraryUsageDescription: >-
          Campus adds photos you choose to your workspace.
        NSLocalNetworkUsageDescription: >-
          Campus syncs with your PC over your own Wi-Fi network. Nothing leaves it.
        NSBonjourServices:
          - _campus-sync._tcp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.campus.pocket
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleLightContent
        CODE_SIGN_ENTITLEMENTS: CampusPocket/CampusPocket.entitlements

  # The share sheet target. It writes one small file into the group container and closes; it
  # never opens the workspace, never reaches the network, and holds no key.
  CampusShare:
    type: app-extension
    platform: iOS
    sources:
      - path: CampusShare
      - path: CampusShared
    info:
      path: CampusShare/Info.plist
      properties:
        CFBundleDisplayName: Campus
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsFileWithMaxCount: 1
              NSExtensionActivationSupportsImageWithMaxCount: 1
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.campus.pocket.share
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_ENTITLEMENTS: CampusShare/CampusShare.entitlements

  CampusPocketTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: CampusPocketTests
    dependencies:
      - target: CampusPocket

schemes:
  CampusPocket:
    build:
      targets:
        CampusPocket: all
        CampusShare: all
        CampusPocketTests: [test]
    test:
      targets:
        - CampusPocketTests
      gatherCoverageData: true
