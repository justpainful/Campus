name: Campus Pocket (iOS)

on:
  push:
    branches: [main]
    paths:
      - "apps/ios/**"
      - ".github/workflows/ios.yml"
  pull_request:
    paths:
      - "apps/ios/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        # Pinned rather than "latest": a toolchain that changes underneath you turns an unrelated
        # push into a mystery failure.
        run: sudo xcode-select -switch /Applications/Xcode_16.2.app

      - name: Show versions
        run: |
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the Xcode project
        working-directory: apps/ios
        run: xcodegen generate

      - name: Build and test on the simulator
        working-directory: apps/ios
        run: |
          set -o pipefail
          xcodebuild test \
            -project CampusPocket.xcodeproj \
            -scheme CampusPocket \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify --renderer github-actions

      - name: Archive for device
        # Unsigned: the runner has no certificates and should not. This proves the app builds for
        # real hardware; installing it needs a signing identity, which is a separate decision.
        working-directory: apps/ios
        run: |
          set -o pipefail
          xcodebuild archive \
            -project CampusPocket.xcodeproj \
            -scheme CampusPocket \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/CampusPocket.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            | xcbeautify --renderer github-actions

      - name: Package the app bundle
        working-directory: apps/ios
        run: |
          mkdir -p build/Payload
          cp -R build/CampusPocket.xcarchive/Products/Applications/CampusPocket.app build/Payload/
          cd build && zip -qry CampusPocket-unsigned.ipa Payload

      - name: Upload the build
        uses: actions/upload-artifact@v4
        with:
          name: CampusPocket-unsigned
          path: apps/ios/build/CampusPocket-unsigned.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-results
          path: apps/ios/TestResults.xcresult
          if-no-files-found: ignore
          retention-days: 7

  screenshots:
    name: Screenshots
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -switch /Applications/Xcode_16.2.app

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the Xcode project
        working-directory: apps/ios
        run: xcodegen generate

      - name: Build for the simulator
        working-directory: apps/ios
        run: |
          set -o pipefail
          xcodebuild build \
            -project CampusPocket.xcodeproj \
            -scheme CampusPocket \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 16 Pro,OS=latest' \
            -derivedDataPath build/simulator \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify --renderer github-actions

      # Screenshots are taken from the running app rather than posed, so they cannot drift away
      # from what the app actually does. The sample content is seeded through the same outbox the
      # app uses, and the screen to open is named on the command line.
      - name: Take the screenshots
        working-directory: apps/ios
        run: |
          set -euo pipefail

          device=$(xcrun simctl create "Campus screenshots" "iPhone 16 Pro")
          xcrun simctl boot "$device"
          xcrun simctl bootstatus "$device" -b

          # Dark, because the app is dark-first, and a clean status bar because a screenshot of
          # a runner's battery percentage tells the reader nothing.
          xcrun simctl ui "$device" appearance dark
          xcrun simctl status_bar "$device" override \
            --time "09:41" \
            --batteryState charged --batteryLevel 100 \
            --cellularMode active --cellularBars 4 \
            --dataNetwork wifi --wifiMode active --wifiBars 3

          app=build/simulator/Build/Products/Debug-iphonesimulator/CampusPocket.app
          xcrun simctl install "$device" "$app"

          mkdir -p screenshots

          for screen in capture outbox settings compose; do
            xcrun simctl launch "$device" com.campus.pocket --sample-data --screen "$screen"
            sleep 6
            xcrun simctl io "$device" screenshot "screenshots/$screen.png"
            xcrun simctl terminate "$device" com.campus.pocket || true
            sleep 1
          done

          # The same four in light, because half the world runs their phone that way and a
          # dark-first app still has to be legible in it.
          xcrun simctl ui "$device" appearance light
          for screen in capture outbox; do
            xcrun simctl launch "$device" com.campus.pocket --sample-data --screen "$screen"
            sleep 6
            xcrun simctl io "$device" screenshot "screenshots/$screen-light.png"
            xcrun simctl terminate "$device" com.campus.pocket || true
            sleep 1
          done

          xcrun simctl shutdown "$device"
          xcrun simctl delete "$device"

          ls -la screenshots

      - name: Upload the screenshots
        uses: actions/upload-artifact@v4
        with:
          name: CampusPocket-screenshots
          path: apps/ios/screenshots
          if-no-files-found: error
          retention-days: 30
